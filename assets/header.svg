<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b18"/><stop offset="1" stop-color="#11162e"/>
  </linearGradient>
  <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="1260" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".33" stop-color="#a78bfa"/>
    <stop offset=".66" stop-color="#f472b6"/><stop offset="1" stop-color="#22d3ee"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;-600 0;0 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity=".045"/>
  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <clipPath id="frame"><rect width="1200" height="330" rx="22"/></clipPath>
</defs>
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
  .b1 { animation: drift1 14s ease-in-out infinite; }
  .b2 { animation: drift2 18s ease-in-out infinite; }
  .b3 { animation: drift1 22s ease-in-out infinite reverse; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(140px,40px); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-160px,-30px); } }
  .in { animation: in .9s cubic-bezier(.2,.7,.2,1) backwards; }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .spin { transform-origin: 960px 165px; animation: spin 24s linear infinite; }
  .spin-r { transform-origin: 960px 165px; animation: spin 16s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .float { animation: float 5s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
</style>

<g clip-path="url(#frame)">
  <rect width="1200" height="330" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".75">
    <circle class="b1" cx="180" cy="60" r="150" fill="#22d3ee" fill-opacity=".35"/>
    <circle class="b2" cx="900" cy="300" r="170" fill="#a78bfa" fill-opacity=".40"/>
    <circle class="b3" cx="620" cy="20" r="120" fill="#f472b6" fill-opacity=".28"/>
  </g>
  <rect width="1200" height="330" fill="url(#grid)"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="328.5" rx="22" stroke="url(#edge)" stroke-opacity=".55" stroke-width="1.5"/>

<!-- left: intro -->
<g class="in" style="animation-delay:.1s">
  <rect x="64" y="58" width="196" height="30" rx="15" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".4"/>
  <circle cx="84" cy="73" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="98" y="78" font-size="14" font-weight="600" fill="#a5f3fc">Hello, World! I'm</text>
</g>
<text x="60" y="160" font-size="74" font-weight="800" fill="url(#name)" letter-spacing="-1" class="in" style="animation-delay:.25s">Muhammad Aman</text>
<text x="64" y="204" font-size="22" font-weight="600" fill="#e6edf3" class="in" style="animation-delay:.45s">Full Stack Developer <tspan fill="#5b6488">·</tspan> Web &amp; Mobile <tspan fill="#5b6488">·</tspan> Pakistan 🇵🇰</text>
<g class="in" style="animation-delay:.65s">
  <rect x="64" y="234" width="470" height="42" rx="10" fill="#000000" fill-opacity=".35" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="84" y="261" font-size="15" class="mono"><tspan fill="#34d399">❯</tspan><tspan fill="#a78bfa"> npm run</tspan><tspan fill="#e6edf3"> build-ideas</tspan><tspan fill="#8b98b8"> --into=products</tspan></text>
  <rect x="510" y="248" width="9" height="16" fill="#22d3ee" class="cursor"/>
</g>

<!-- right: orbit -->
<g class="in" style="animation-delay:.4s">
  <circle cx="960" cy="165" r="118" stroke="#a78bfa" stroke-opacity=".35" stroke-dasharray="4 10" class="spin"/>
  <circle cx="960" cy="165" r="84" stroke="#22d3ee" stroke-opacity=".35" stroke-dasharray="2 8" class="spin-r"/>
  <g class="spin"><circle cx="1078" cy="165" r="7" fill="#f472b6"/><circle cx="842" cy="165" r="5" fill="#22d3ee"/></g>
  <g class="spin-r"><circle cx="960" cy="81" r="6" fill="#a78bfa"/><circle cx="960" cy="249" r="4" fill="#34d399"/></g>
  <g class="float">
    <rect x="910" y="125" width="100" height="80" rx="18" fill="#0b1020" stroke="url(#edge)" stroke-width="2"/>
    <text x="960" y="178" text-anchor="middle" font-size="34" font-weight="800" class="mono" fill="url(#name)">&lt;/&gt;</text>
  </g>
</g>
</svg>
